name: Build Windows portable release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
          architecture: x64
      - name: Build bundled distribution
        shell: pwsh
        run: |
          python build_portable.py --git-root 'C:\Program Files\Git'
      - name: Verify extracted distribution without global Python or Git
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'dist/IPQuality-Windows-x64-Portable-v1.0.0.zip' -DestinationPath 'work/便携包 QA'
          $package = Join-Path $PWD 'work/便携包 QA/IPQuality-Windows-Report'
          $env:PATH = "$env:SystemRoot\System32"
          & "$package/runtime/python/python.exe" -X utf8 "$package/launcher.py" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish first release and downloadable assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gh = 'C:\Program Files\GitHub CLI\gh.exe'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v1.0.0' }
          & $gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists; keeping its assets."; exit 0 }
          & $gh release create $tag 'dist/IPQuality-Windows-x64-Portable-v1.0.0.zip' 'dist/IPQuality-Windows-x64-Portable-v1.0.0.zip.sha256' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "IPQuality Windows Portable $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
